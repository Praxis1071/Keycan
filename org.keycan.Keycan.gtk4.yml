app-id: org.keycan.Keycan
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: keycan

# Keycan 2.0: GTK4 + libadwaita + PyGObject.

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri

modules:
  - name: keycan
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/share/keycan/main.py
      - install -Dm644 keycan/__init__.py /app/share/keycan/keycan/__init__.py
      - install -Dm644 keycan/app.py /app/share/keycan/keycan/app.py
      - install -Dm644 keycan/window.py /app/share/keycan/keycan/window.py
      - install -Dm644 keycan/core/__init__.py /app/share/keycan/keycan/core/__init__.py
      - install -Dm644 keycan/core/typing_engine.py /app/share/keycan/keycan/core/typing_engine.py
      - install -Dm644 keycan/data/__init__.py /app/share/keycan/keycan/data/__init__.py
      - install -Dm644 keycan/data/database.py /app/share/keycan/keycan/data/database.py
      - install -Dm644 keycan/utils/__init__.py /app/share/keycan/keycan/utils/__init__.py
      - install -Dm644 keycan/utils/text.py /app/share/keycan/keycan/utils/text.py
      - install -Dm644 typing_data.db /app/share/keycan/data/typing_data.db
      - install -Dm755 keycan-gtk4-wrapper /app/bin/keycan
      - install -Dm644 org.keycan.Keycan.desktop /app/share/applications/org.keycan.Keycan.desktop
      - install -Dm644 org.keycan.Keycan.png /app/share/icons/hicolor/512x512/apps/org.keycan.Keycan.png
    sources:
      - type: dir
        path: .
