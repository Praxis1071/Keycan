app-id: org.keycan.Keycan
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: keycan

# Keycan: GTK4 + libadwaita sürümü.
# Uygulama Python + PyGObject ile çalışır.

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri

modules:
  - name: keycan
    buildsystem: simple
    build-commands:
      - install -Dm644 gtk_main.py /app/share/keycan/gtk_main.py
      - install -Dm644 keycan-gtk4-launcher.py /app/share/keycan/keycan-gtk4-launcher.py
      - install -Dm644 typing_data.db /app/share/keycan/typing_data.db
      - install -Dm755 keycan-gtk4-wrapper /app/bin/keycan
      - install -Dm644 org.keycan.Keycan.desktop /app/share/applications/org.keycan.Keycan.desktop
      - install -Dm644 org.keycan.Keycan.svg /app/share/icons/hicolor/scalable/apps/org.keycan.Keycan.svg
    sources:
      - type: dir
        path: .
