name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  stage5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Stage 5 tests
        run: |
          if ! pytest -q tests/test_stage5_statistics.py > /tmp/stage5.log 2>&1; then
            cat /tmp/stage5.log
            cp /tmp/stage5.log ci-stage5-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-stage5-failure.txt
            git commit -m "ci: capture stage5 test failure"
            git push
            exit 1
          fi

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run full test suite
        run: |
          if ! pytest -q > /tmp/regression.log 2>&1; then
            cat /tmp/regression.log
            cp /tmp/regression.log ci-regression-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-regression-failure.txt
            git commit -m "ci: capture regression test failure"
            git push
            exit 1
          fi
