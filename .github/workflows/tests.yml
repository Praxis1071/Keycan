name: Tests

on:
  push:
  pull_request:

env:
  PYTHONPATH: .

jobs:
  stage5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Stage 5 tests
        run: pytest -q tests/test_stage5_statistics.py


  stage6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Validate Stage 6 Python modules
        run: python -m py_compile main.py keycan/app.py keycan/window.py keycan/gui/settings2.py keycan/gui/profile.py keycan/services/preferences.py keycan/services/i18n.py keycan/services/progression.py
      - name: Run Stage 6 preference tests
        run: pytest -q tests/test_stage6_preferences.py tests/test_stage6_i18n.py

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run full test suite
        run: pytest -q
